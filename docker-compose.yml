version: "3.9"

# SchuleZap — stack completa (front + back + banco)
# No Coolify você pode subir cada serviço separado apontando pro mesmo projeto,
# ou usar este compose. O Postgres você já criou no painel; se preferir usá-lo,
# remova o serviço 'db' daqui e aponte DATABASE_URL pro banco do Coolify.

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: schulezap
      POSTGRES_PASSWORD: ${DB_PASSWORD:-trocar_senha}
      POSTGRES_DB: schulezap
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schulezap"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://schulezap:${DB_PASSWORD:-trocar_senha}@db:5432/schulezap
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-troque_esta_chave_por_uma_bem_longa}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      RUN_SEEDS: ${RUN_SEEDS:-true}
      RAILS_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"

  frontend:
    build:
      context: .
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:3000/api/v1}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
